html<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .calc {
            background: #e8e8e8;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 20px;
            width: 300px;
        }

        .display {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: right;
        }

        .hist {
            font-size: 13px;
            color: #888;
            min-height: 18px;
            margin-bottom: 4px;
        }

        .result {
            font-size: 32px;
            font-weight: 500;
            color: #111;
            word-break: break-all;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn {
            padding: 16px 8px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            background: #fff;
            color: #111;
            transition: transform 0.08s;
        }

        .btn:active { transform: scale(0.95); }

        .btn-op {
            background: #dceeff;
            color: #0a4a8a;
            border-color: #a0c4f0;
        }

        .btn-eq {
            background: #fff;
            border: 2px solid #a0c4f0;
            color: #0a4a8a;
        }

        .btn-cl {
            background: #fde8e8;
            color: #a32d2d;
            border-color: #f0a0a0;
        }

        .btn-ac {
            background: #fef3d8;
            color: #7a4f00;
            border-color: #f0c060;
        }

        .span2 { grid-column: span 2; }
    </style>
</head>
<body>
    <div class="calc">
        <div class="display">
            <div class="hist" id="hist"></div>
            <div class="result" id="res">0</div>
        </div>
        <div class="grid">
            <button class="btn btn-ac" onclick="limpar()">AC</button>
            <button class="btn btn-cl" onclick="apagar()">⌫</button>
            <button class="btn btn-op" onclick="add('%')">%</button>
            <button class="btn btn-op" onclick="add('/')">÷</button>

            <button class="btn" onclick="add('7')">7</button>
            <button class="btn" onclick="add('8')">8</button>
            <button class="btn" onclick="add('9')">9</button>
            <button class="btn btn-op" onclick="add('*')">×</button>

            <button class="btn" onclick="add('4')">4</button>
            <button class="btn" onclick="add('5')">5</button>
            <button class="btn" onclick="add('6')">6</button>
            <button class="btn btn-op" onclick="add('-')">−</button>

            <button class="btn" onclick="add('1')">1</button>
            <button class="btn" onclick="add('2')">2</button>
            <button class="btn" onclick="add('3')">3</button>
            <button class="btn btn-op" onclick="add('+')">+</button>

            <button class="btn span2" onclick="add('0')">0</button>
            <button class="btn" onclick="ponto()">.</button>
            <button class="btn btn-eq" onclick="calcular()">=</button>
        </div>
    </div>

    <script>
        let expr = '', novo = true;
        const res = document.getElementById('res');
        const hist = document.getElementById('hist');

        function atualizar(v) { res.textContent = v || '0'; }

        function add(n) {
            if (novo && !'+-*/%'.includes(n)) { expr = n; novo = false; }
            else { if (novo) novo = false; expr += n; }
            atualizar(expr);
        }

        function limpar() { expr = ''; novo = true; hist.textContent = ''; atualizar('0'); }

        function apagar() { expr = expr.slice(0, -1); atualizar(expr || '0'); }

        function ponto() {
            const parts = expr.split(/[\+\-\*\/]/);
            if (!parts[parts.length - 1].includes('.')) { expr += '.'; atualizar(expr); }
        }

        function calcular() {
            try {
                hist.textContent = expr.replace(/\*/g, '×').replace(/\//g, '÷') + ' =';
                let r = Function('"use strict"; return (' + expr + ')')();
                r = parseFloat(r.toFixed(10));
                atualizar(r);
                expr = String(r);
                novo = true;
            } catch { atualizar('Erro'); expr = ''; novo = true; }
        }
    </script>
</body>
</html>
